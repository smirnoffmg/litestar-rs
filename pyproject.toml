[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smallage"
version = "0.2.0"
description = "Background tasks, cron and a dead letter queue on Redis Streams, with a Litestar integration"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksim Smirnov" }]
keywords = [
    "redis",
    "redis-streams",
    "streams",
    "task-queue",
    "background-tasks",
    "cron",
    "dlq",
    "dead-letter-queue",
    "celery",
    "faststream",
    "litestar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "redis[hiredis]>=5.0",
    "msgspec>=0.18",
    "anyio>=4.2",
    "uvloop>=0.21",
    "cronsim>=2.7",
    # A plain dependency rather than an extra: the Litestar layer is half of
    # what this package is for, and an extra nearly everyone installs anyway
    # only stands in the way. "core works without Litestar" is a rule about
    # imports -- the contract below enforces it -- not about what gets installed.
    "litestar>=2.0",
]

[project.urls]
Homepage = "https://github.com/smirnoffmg/smallage"
Documentation = "https://smirnoffmg.dev/smallage/"
Source = "https://github.com/smirnoffmg/smallage"
Issues = "https://github.com/smirnoffmg/smallage/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smallage"]

[dependency-groups]
# Only the benchmarks need these, and only to measure something other than us.
bench = [
    "saq>=0.12",
    "scalene>=1.5",
    "testcontainers[redis]>=4.15.0",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "import-linter",
    "pre-commit",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "testcontainers[redis]>=4.15.0",
    "litestar>=2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RET", "SIM", "TID", "PTH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# A worked example of testing an application is itself a test module.
"examples/testing_your_app.py" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["smallage"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]
mypy_path = ["src"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# `deprecated` catches PEP 702 deprecations -- such as annotating an
# @asynccontextmanager function as returning AsyncIterator -- which an editor
# would otherwise be the only thing to notice.
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "deprecated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
anyio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: no external dependencies",
    "integration: requires a real Redis 7+",
    "slow: spawns processes",
]

[tool.coverage.run]
source_pkgs = ["smallage.core", "smallage.litestar"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.importlinter]
root_packages = ["smallage", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is framework-free"
type = "forbidden"
source_modules = ["smallage.core"]
forbidden_modules = ["litestar", "click", "smallage.litestar"]

# Payloads come back out of Redis; unpickling one is remote code execution the
# moment Redis is compromised.
[[tool.importlinter.contracts]]
name = "Payloads are never unpickled"
type = "forbidden"
source_modules = ["smallage"]
forbidden_modules = ["pickle", "shelve", "dill", "cloudpickle"]

[[tool.importlinter.contracts]]
name = "The Litestar layer sits above core"
type = "layers"
layers = ["smallage.litestar", "smallage.core"]

[[tool.importlinter.contracts]]
name = "Core tests are framework-free"
type = "forbidden"
source_modules = ["tests.core"]
forbidden_modules = ["litestar", "click"]

[[tool.importlinter.contracts]]
name = "Core internal layering"
type = "layers"
containers = ["smallage.core"]
layers = [
    "testing",
    "worker : deferred",
    "transport : scheduler : results : payloads",
    "scripts",
    "protocols",
    "cron : retry : clients : stats",
    "envelope : keys",
    "errors",
]

[[tool.importlinter.contracts]]
name = "Subsystems meet only through protocols"
type = "independence"
modules = [
    "smallage.core.transport",
    "smallage.core.scheduler",
    "smallage.core.results",
    "smallage.core.payloads",
]
