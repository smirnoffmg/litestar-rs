[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litestar-rs"
version = "0.1.4"
description = "Distributed task queue on Redis Streams with first-class Litestar integration"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksim Smirnov" }]
keywords = ["litestar", "redis", "redis-streams", "task-queue", "worker", "cron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "redis[hiredis]>=5.0",
    "msgspec>=0.18",
    "anyio>=4.2",
    "uvloop>=0.21",
    "cronsim>=2.7",
    # A plain dependency, not an extra. "core works without Litestar" is a rule
    # about imports -- checked by the import-linter contract below -- not about
    # what gets installed, and nobody adds a package called litestar-rs in order
    # to avoid Litestar.
    "litestar>=2.0",
]

[project.urls]
Homepage = "https://github.com/smirnoffmg/litestar-rs"
Documentation = "https://smirnoffmg.dev/litestar-rs/"
Source = "https://github.com/smirnoffmg/litestar-rs"
Issues = "https://github.com/smirnoffmg/litestar-rs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_rs"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "import-linter",
    "pre-commit",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "testcontainers[redis]>=4.15.0",
    "litestar>=2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RET", "SIM", "TID", "PTH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# A worked example of testing an application is itself a test module.
"examples/testing_your_app.py" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["litestar_rs"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]
mypy_path = ["src"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# `deprecated` catches PEP 702 deprecations -- such as annotating an
# @asynccontextmanager function as returning AsyncIterator -- which an editor
# would otherwise be the only thing to notice.
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "deprecated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
anyio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: no external dependencies",
    "integration: requires a real Redis 7+",
    "slow: spawns processes",
]

[tool.coverage.run]
source_pkgs = ["litestar_rs.core", "litestar_rs.plugin"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.importlinter]
root_packages = ["litestar_rs", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is framework-free"
type = "forbidden"
source_modules = ["litestar_rs.core"]
forbidden_modules = ["litestar", "click", "litestar_rs.plugin"]

# Payloads come back out of Redis; unpickling one is remote code execution the
# moment Redis is compromised.
[[tool.importlinter.contracts]]
name = "Payloads are never unpickled"
type = "forbidden"
source_modules = ["litestar_rs"]
forbidden_modules = ["pickle", "shelve", "dill", "cloudpickle"]

[[tool.importlinter.contracts]]
name = "Plugin sits above core"
type = "layers"
layers = ["litestar_rs.plugin", "litestar_rs.core"]

[[tool.importlinter.contracts]]
name = "Core tests are framework-free"
type = "forbidden"
source_modules = ["tests.core"]
forbidden_modules = ["litestar", "click"]

[[tool.importlinter.contracts]]
name = "Core internal layering"
type = "layers"
containers = ["litestar_rs.core"]
layers = [
    "testing",
    "worker : deferred",
    "transport : scheduler : results : payloads",
    "scripts",
    "protocols",
    "cron : retry : clients : stats",
    "envelope : keys",
    "errors",
]

[[tool.importlinter.contracts]]
name = "Subsystems meet only through protocols"
type = "independence"
modules = [
    "litestar_rs.core.transport",
    "litestar_rs.core.scheduler",
    "litestar_rs.core.results",
    "litestar_rs.core.payloads",
]
