site_name: litestar-rs
site_description: Distributed task queue on Redis Streams with first-class Litestar integration
site_url: https://smirnoffmg.dev/litestar-rs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Without these, Material renders code as a plain <pre>: no highlighting, and
# long lines are clipped rather than scrolled.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true

nav:
  - Home: index.md
  - Design and invariants: design.md
  - Tasks: tasks.md
  - Scheduling: scheduling.md
  - Retries and the DLQ: retries.md
  - Priorities: priorities.md
  - Broker mode: broker.md
  - Results and deduplication: results.md
  - Testing: testing.md
  - Operations: operations.md
  - API reference: api.md
